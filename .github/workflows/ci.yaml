name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    # “At 08:50 on every day-of-week from Monday through Friday.”
    #
    # Staggered across the six SDK repos (java :30, python :35, php :40,
    # go :45, csharp :50, typescript :55). They all run their live suites
    # against the one shared e2e sandbox, and firing together stampedes the
    # auth path's cold public-key cache -> Envelope /decrypt times out at 3s
    # -> every endpoint 500s (Sentry CORE-API-1N0). Keep these apart.
    - cron: 50 8 * * 1-5

# A new push to a PR cancels the previous in-flight run (the generation job
# pushes the tri-state patch straight after Speakeasy's commit). Runs on main
# are never cancelled: the publish workflow waits for each one to finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Builds the SDK and tests, and runs the tests that need no sandbox: JWT auth,
  # webhook signatures and the tri-state *Update serialization the regen patch
  # protects. Runs everywhere, including PRs.
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          persist-credentials: false

      - name: Use .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8

      - name: Run offline tests
        run: dotnet test src/Gr4vy.Tests --filter "FullyQualifiedName~AuthTests|FullyQualifiedName~WebhookVerifierTests|FullyQualifiedName~UpdateModelSerializationTests"

  # The live E2E suite against the real sandbox. Each test fixture provisions its
  # own merchant account, so fixtures are isolated and safe to run in parallel —
  # both within a job (LevelOfParallelism, see AssemblyInfo.cs) and split across
  # these shards. Each shard owns a slice of the fixtures via a test filter; add
  # a shard by extending this list. Runs on main only (push, schedule, dispatch):
  # the key lives in the `e2e` Environment, which only main can use.
  test:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: e2e
    strategy:
      fail-fast: false
      matrix:
        dotnet:
          - 8
        shard:
          - name: flows
            filter: FullyQualifiedName~Gr4vy.Tests.Flows
          - name: processing
            filter: FullyQualifiedName~Gr4vy.Tests.Processing
          - name: backoffice
            filter: FullyQualifiedName~Gr4vy.Tests.Backoffice
          - name: other
            filter: FullyQualifiedName!~Gr4vy.Tests.Flows&FullyQualifiedName!~Gr4vy.Tests.Processing&FullyQualifiedName!~Gr4vy.Tests.Backoffice

    steps:
      - name: Check out the repo
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          persist-credentials: false

      - name: Use .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Run tests (${{ matrix.shard.name }})
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          FILTER: ${{ matrix.shard.filter }}
        run: dotnet test src/Gr4vy.Tests --filter "$FILTER"

  # Single, stable status check the branch ruleset requires. The `test` job fans
  # out across a dotnet × shard matrix, so its per-job names change whenever the
  # matrix changes. On a PR it means the offline tests passed; on main it also
  # means every live shard passed, which is what the publish workflow waits for.
  ci-complete:
    needs: [offline, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        env:
          OFFLINE: ${{ needs.offline.result }}
          TEST: ${{ needs.test.result }}
          ON_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$OFFLINE" != "success" ]; then
            echo "offline: $OFFLINE"
            exit 1
          fi
          if [ "$ON_MAIN" != "true" ] && [ "$TEST" = "skipped" ]; then
            exit 0
          fi
          if [ "$TEST" != "success" ]; then
            echo "test: $TEST"
            exit 1
          fi

  # Endpoint reach from the daily (or a manual) run: runs the full suite once,
  # un-sharded, with HTTP tracking, writes the report to the run summary and posts
  # to Slack when an operation had no real request. A report, not a gate, and it
  # never runs on a push, so it never delays a release.
  coverage:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: e2e
    steps:
      - name: Check out the repo
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          persist-credentials: false

      - name: Use .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8

      - name: Run tests with HTTP tracking
        id: suite
        continue-on-error: true
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          # Record outgoing HTTP calls so endpoint reach is measured from real
          # requests (see src/Gr4vy.Tests/Utils/TestEnvironment.cs).
          GR4VY_TRACK_HTTP: "1"
        run: dotnet test src/Gr4vy.Tests

      - name: Build endpoint coverage report
        id: report
        env:
          SUITE: ${{ steps.suite.outcome }}
        run: |
          node scripts/endpoint-coverage.mjs
          if [ "$SUITE" != "success" ]; then
            echo "> ⚠️ **The test suite failed in this run, so the reach below is incomplete.**" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          cat coverage/endpoint-coverage.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo "summary=$(grep -o '[0-9]* / [0-9]*' coverage/endpoint-coverage.md | head -1)"
            echo "missing<<EOF"
            grep '^- `' coverage/endpoint-coverage.md || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post unreached endpoints to Slack
        if: steps.report.outputs.missing != ''
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        env:
            SLACK_USERNAME: C# SDK
            SLACK_TITLE: C# SDK
            SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
            SLACK_CHANNEL: sdk-updates
            SLACK_MSG_AUTHOR: gr4vy-code
            SLACK_ICON_EMOJI: ":gr4vy:"
            SLACK_COLOR: "warning"
            SLACK_MESSAGE: "Endpoint coverage ${{ steps.report.outputs.summary }}. No live test reached:\n${{ steps.report.outputs.missing }}"
            SLACK_FOOTER: ""

  notify:
    needs: [offline, test]
    runs-on: ubuntu-latest
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'gr4vy-sdk-generate[bot]')
        env:
            SLACK_USERNAME: C# SDK
            SLACK_TITLE: C# SDK
            SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
            SLACK_CHANNEL: sdk-updates
            SLACK_MSG_AUTHOR: gr4vy-code
            SLACK_ICON_EMOJI: ":gr4vy:"
            SLACK_COLOR: "failure"
            SLACK_MESSAGE_ON_FAILURE: "CI failed - `${{ github.event.head_commit.message || github.event.pull_request.title }}`"
            SLACK_FOOTER: ""
